# Production configuration. Secrets come from the environment; do NOT
# commit real credentials here.
app:
  env: prod
server:
  port: "8080"
  mode: release
  allowed_origins: []
  trusted_proxies:
    - "172.16.0.0/12"
mysql:
  - name: default
    dsn: "root:${MYSQL_Password}@tcp(mysql:3306)/nanyicrm?charset=utf8mb4&parseTime=True&loc=Local"
redis:
  addr: "redis:6379"
  pwd: "${REDIS_Password}"
  db: 0
llm:
  enabled: ${LLM_ENABLED}
  provider: ${LLM_PROVIDER}
  base_url: ${LLM_BASE_URL}
  api_key: "${LLM_API_KEY}"
  model: ${LLM_MODEL}
  timeout: 30s
  max_tokens: 1200
  temperature: 0.2
  config_version: "${LLM_CONFIG_VERSION}"
  response_format: "${LLM_RESPONSE_FORMAT}"
  thinking_mode: "${LLM_THINKING_MODE}"
jwt:
  signing_key: "${JWT_SIGNING_KEY}"
  access_ttl: 2h
  refresh_ttl: 168h
bootstrap:
  admin_password: "${BOOTSTRAP_ADMIN_PASSWORD}"
  super_admin_password: "${BOOTSTRAP_SUPER_ADMIN_PASSWORD}"
log:
  dir: log
  file: server.log
  retain_days: 30
