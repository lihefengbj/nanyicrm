# Production configuration. Secrets come from the environment; do NOT
# commit real credentials here.
app:
  env: prod
  auto_migrate: false
server:
  port: "8080"
  mode: release
  allowed_origins: []
  trusted_proxies:
    - "172.16.0.0/12"
mysql:
  - name: default
    dsn: "root:${MYSQL_Password}@tcp(mysql:3306)/nanyicrm?charset=utf8mb4&parseTime=True&loc=Local"
redis:
  addr: "redis:6379"
  pwd: "${REDIS_Password}"
  db: 0
llm:
  enabled: ${LLM_ENABLED}
  provider: ${LLM_PROVIDER}
  base_url: ${LLM_BASE_URL}
  api_key: "${LLM_API_KEY}"
  model: ${LLM_MODEL}
  timeout: 30s
  max_tokens: 1200
  temperature: 0.2
  config_version: "${LLM_CONFIG_VERSION}"
  prompt_version: "${LLM_PROMPT_VERSION}"
  response_format: "${LLM_RESPONSE_FORMAT}"
  thinking_mode: "${LLM_THINKING_MODE}"
  retention_days: 30
  archive_days: 365
  pricing:
    currency: "CNY"
    mode: "auto"             # auto or unified
    fixed_period: ""         # optional idle or peak override
    timezone: "Asia/Shanghai"
    holidays: []              # YYYY-MM-DD statutory holidays; weekends are always idle
    peak_periods:              # recurring peak windows; all other times are idle
      - weekdays: [1, 2, 3, 4, 5]
        start: "09:00"
        end: "12:00"
      - weekdays: [1, 2, 3, 4, 5]
        start: "14:00"
        end: "18:00"
    input_cache_hit_idle_per_1m_tokens: 0.02
    input_cache_hit_peak_per_1m_tokens: 0.04
    input_cache_miss_idle_per_1m_tokens: 1
    input_cache_miss_peak_per_1m_tokens: 2
    output_idle_per_1m_tokens: 4
    output_peak_per_1m_tokens: 8
  quota:
    daily_calls: 1000      # 每租户每日AI意向分析次数上限，0 表示不限制
    daily_tokens: 2000000  # 每租户单日Token用量上限，0 表示不限制
    concurrency: 5         # 每租户并发分析上限，0 表示不限制
jwt:
  signing_key: "${JWT_SIGNING_KEY}"
  access_ttl: 2h
  refresh_ttl: 168h
bootstrap:
  admin_password: "${BOOTSTRAP_ADMIN_PASSWORD}"
  super_admin_password: "${BOOTSTRAP_SUPER_ADMIN_PASSWORD}"
log:
  dir: log
  file: server.log
  retain_days: 30
alerts:
  enabled: ${ALERTS_ENABLED}
  webhook_url: "${ALERTS_WEBHOOK_URL}"
  login_failure_threshold: 5
  window: 10m
metrics:
  enabled: true
  token: "${METRICS_TOKEN}"
