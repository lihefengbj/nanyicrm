# nanyicrm backend configuration file.
# Set CONFIG_PATH env var to point at a different file.

app:
  env: dev               # dev / test / prod；prod 时关闭 /swagger 接口文档

server:
  port: "8080"
  mode: debug            # debug / release
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  trusted_proxies:
    - "127.0.0.1"
    - "::1"

# Multiple MySQL connections are supported; "name" identifies each one.
# The connection named "default" is used for auto-migrate, seed and business data.
mysql:
  - name: default
    dsn: "${MYSQL_DSN}"
  # - name: report
  #   dsn: "user:pwd@tcp(127.0.0.1:3306)/report?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "${REDIS_ADDR}"
  pwd: "${REDIS_PASSWORD}"
  db: 0

llm:
  enabled: true
  provider: deepseek
  base_url: "https://api.deepseek.com"
  api_key: "${LLM_API_KEY}"
  model: "deepseek-flash"
  timeout: 30s
  max_tokens: 1200
  temperature: 0.2
  config_version: "deepseek-flash-v1"
  response_format: "json_object"
  thinking_mode: "disabled"
  retention_days: 0       # AI input/result snapshots to retain; 0 disables automatic cleanup
  pricing:
    currency: "CNY"
    mode: "auto"             # auto or unified
    fixed_period: ""         # optional idle or peak override
    timezone: "Asia/Shanghai"
    holidays: []              # YYYY-MM-DD statutory holidays; weekends are always idle
    peak_periods:              # recurring peak windows; all other times are idle
      - weekdays: [1, 2, 3, 4, 5]
        start: "09:00"
        end: "12:00"
      - weekdays: [1, 2, 3, 4, 5]
        start: "14:00"
        end: "18:00"
    input_cache_hit_idle_per_1m_tokens: 0.02
    input_cache_hit_peak_per_1m_tokens: 0.04
    input_cache_miss_idle_per_1m_tokens: 1
    input_cache_miss_peak_per_1m_tokens: 2
    output_idle_per_1m_tokens: 4
    output_peak_per_1m_tokens: 8
  quota:
    daily_calls: 1000      # 每租户每日AI意向分析次数上限，0 表示不限制
    daily_tokens: 2000000  # 每租户单日Token用量上限，0 表示不限制
    concurrency: 5         # 每租户并发分析上限，0 表示不限制

jwt:
  signing_key: "nanyicrm-dev-signing-key-change-me"   # change in production!
  access_ttl: 2h
  refresh_ttl: 168h

bootstrap:
  admin_password: "admin123"
  super_admin_password: "superAdmin123"

log:
  dir: log               # log output directory (relative to backend workdir)
  file: server.log       # base name; actual file is server_yyyymmdd.log, rotated daily
  retain_days: 30        # days to keep daily log files, 0 keeps forever
