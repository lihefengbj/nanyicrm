basePath: /api/v1
definitions:
  common.TokenPair:
    properties:
      accessToken:
        type: string
      expiresIn:
        description: access token TTL in seconds
        type: integer
      refreshToken:
        type: string
    type: object
  system.ApiUpdateTitleRequest:
    properties:
      title:
        maxLength: 64
        type: string
    type: object
  system.LoginRequest:
    properties:
      pwd:
        type: string
      username:
        type: string
    required:
    - pwd
    - username
    type: object
  system.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
host: localhost:8080
info:
  contact: {}
  description: Nanyi CRM 管理后台接口文档。统一前缀 /api/v1，响应结构 { code, message, data }，分页结构 {
    records, total, pageNum, pageSize }。异常码段：1xxx 参数 / 2xxx 认证授权 / 3xxx 业务 / 5xxx
    系统。
  title: Nanyi CRM API
  version: "1.0"
paths:
  /auth/login:
    post:
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/system.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.TokenPair'
      summary: 登录，颁发 access/refresh token
      tags:
      - 认证
  /auth/logout:
    post:
      parameters:
      - description: 要吊销的 refresh token
        in: body
        name: body
        schema:
          $ref: '#/definitions/system.RefreshRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 吊销 refresh token
      tags:
      - 认证
  /auth/profile:
