# Local development dependencies: MySQL 8 + Redis 7.
# Usage: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: nanyicrm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_Password: root
      MYSQL_DATABASE: nanyicrm
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nanyicrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
