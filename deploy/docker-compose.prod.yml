# Full production stack: frontend (nginx) + backend (go) + MySQL 8 + Redis 7.
# Usage:
#   cp deploy/.env.example deploy/.env   # fill in Secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: nanyicrm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_Password: ${MYSQL_Password}
      MYSQL_DATABASE: nanyicrm
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_Password}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nanyicrm-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_Password}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_Password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    container_name: nanyicrm-backend
    restart: unless-stopped
    environment:
      MYSQL_Password: ${MYSQL_Password}
      REDIS_Password: ${REDIS_Password}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD}
    volumes:
      - backend-log:/app/log
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ../frontend
    container_name: nanyicrm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  backend-log:
